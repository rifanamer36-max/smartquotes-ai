<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartQuotes AI - تحليل الاقتباسات الذكي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 selection:bg-indigo-500 selection:text-white">

    <div class="max-w-2xl w-full bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-3xl p-6 md:p-8 shadow-2xl relative overflow-hidden">
        
        <!-- Glow Accent Background -->
        <div class="absolute -top-20 -right-20 w-56 h-56 bg-indigo-500/20 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-20 -left-20 w-56 h-56 bg-purple-500/20 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Header -->
        <div class="text-center mb-8 relative z-10">
            <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 text-xs font-semibold mb-4">
                <span>✨ محرك تحليل المشاعر بالذكاء الاصطناعي</span>
            </div>
            <h1 class="text-3xl md:text-4xl font-bold tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
                Smart Quotes AI
            </h1>
            <p class="text-slate-400 text-sm md:text-base mt-2">
                أدخل أي اقتباس أو نص لتحليل النبرة والمشاعر ودقتها فوراً.
            </p>
        </div>

        <!-- Input Area -->
        <div class="space-y-4 relative z-10">
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-2 mr-1">الاقتباس / النص المراد تحليله</label>
                <textarea id="quoteInput" rows="4" dir="ltr" 
                    placeholder="e.g. Today I was with my friend and they said something hurtful..." 
                    class="w-full bg-slate-950/60 border border-slate-800 rounded-2xl p-4 text-slate-100 placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition duration-200 resize-none font-sans text-base leading-relaxed"></textarea>
            </div>

            <button onclick="analyzeQuote()" id="submitBtn" 
                class="w-full bg-indigo-600 hover:bg-indigo-500 active:scale-[0.99] text-white font-bold py-3.5 px-6 rounded-2xl shadow-lg shadow-indigo-600/25 transition duration-200 flex items-center justify-center gap-2">
                <span>تحليل النص الآن</span>
                <span id="btnIcon">⚡</span>
            </button>
        </div>

        <!-- Results Card -->
        <div id="resultCard" class="hidden mt-6 p-5 rounded-2xl border transition-all duration-300 relative z-10">
            <div class="flex items-center justify-between mb-3">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">نتيجة التحليل</span>
                <span id="scoreBadge" class="text-xs font-mono font-bold px-2.5 py-1 rounded-full bg-slate-800 text-slate-300">
                    Polarity: 0.0
                </span>
            </div>

            <div class="text-xl md:text-2xl font-bold text-slate-100 mb-1" id="sentimentOutput">
                --
            </div>

            <!-- Sentiment Progress Indicator -->
            <div class="w-full bg-slate-950/80 rounded-full h-2 mt-4 overflow-hidden border border-slate-800">
                <div id="sentimentBar" class="h-full w-1/2 bg-indigo-500 transition-all duration-500"></div>
            </div>
        </div>

    </div>

    <script>
        async function analyzeQuote() {
            const quote = document.getElementById('quoteInput').value.trim();
            const resultCard = document.getElementById('resultCard');
            const sentimentOutput = document.getElementById('sentimentOutput');
            const scoreBadge = document.getElementById('scoreBadge');
            const sentimentBar = document.getElementById('sentimentBar');
            const submitBtn = document.getElementById('submitBtn');

            if (!quote) {
                alert('الرجاء كتابة اقتباس أولاً قبل التحليل.');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-75');
            submitBtn.innerText = 'جاري التحليل...';

            try {
                const response = await fetch('https://smartquotes-ai-1.onrender.com/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ quote })
                });

                const data = await response.json();

                sentimentOutput.innerText = data.sentiment;
                scoreBadge.innerText = `Polarity Score: ${data.polarity_score}`;

                // ضبط شكل كرت النتيجة حسب الفئة
                resultCard.classList.remove('hidden', 'bg-emerald-950/40', 'border-emerald-800/50', 'bg-rose-950/40', 'border-rose-800/50', 'bg-slate-950/60', 'border-slate-800');

                let barWidth = ((data.polarity_score + 1) / 2) * 100; // تحويل السكور من (-1 إلى 1) إلى نسبة مئوية (0% إلى 100%)
                sentimentBar.style.width = `${Math.max(5, Math.min(100, barWidth))}%`;

                if (data.category === 'positive') {
                    resultCard.classList.add('bg-emerald-950/30', 'border-emerald-800/40');
                    sentimentBar.className = 'h-full bg-emerald-500 transition-all duration-500';
                } else if (data.category === 'negative') {
                    resultCard.classList.add('bg-rose-950/30', 'border-rose-800/40');
                    sentimentBar.className = 'h-full bg-rose-500 transition-all duration-500';
                } else {
                    resultCard.classList.add('bg-slate-900/90', 'border-slate-800');
                    sentimentBar.className = 'h-full bg-indigo-500 transition-all duration-500';
                }

            } catch (error) {
                alert('حدث خطأ أثناء الاتصال بالخادم. يرجى المحاولة لاحقاً.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-75');
                submitBtn.innerHTML = '<span>تحليل النص الآن</span>⚡';
            }
        }
    </script>
</body>
</html>
